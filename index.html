<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sorry Bhaiya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Dancing+Script:wght@600&family=Merriweather:ital,wght@0,400;1,400&family=Nunito:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg1: #ffecd2;
        --bg2: #fcb69f;
        --red: #ff6b6b;
        --yellow: #feca57;
        --orange: #ff8e53;
        --text: #2b2b2b;
        --muted: #6b7280;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow: hidden;
        background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
        opacity: 0;
        transition: opacity 1s ease-out;
        color: var(--text);
      }

      body.is-visible { opacity: 1; }

      .circle {
        position: absolute;
        border-radius: 9999px;
        filter: blur(64px);
        opacity: 0;
        transform: scale(0);
        transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: none;
      }

      .circle.is-visible { opacity: 1; transform: scale(1); }

      .circle--tl {
        top: 40px;
        left: 40px;
        width: 256px;
        height: 256px;
        background: radial-gradient(circle, rgba(255, 107, 107, 0.3), transparent);
      }

      .circle--br {
        bottom: 40px;
        right: 40px;
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, rgba(254, 202, 87, 0.3), transparent);
        transition-delay: 0.2s;
      }

      .card {
        position: relative;
        width: min(720px, calc(100vw - 32px));
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18);
        background: linear-gradient(to bottom, #fff9f0, #ffffff);
        border: 3px solid rgba(252, 182, 159, 0.3);
        transform: translateY(40px) scale(0.8) rotateX(-15deg);
        opacity: 0;
        transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-style: preserve-3d;
        perspective: 1000px;
      }

      .card.is-visible {
        transform: translateY(0) scale(1) rotateX(0deg);
        opacity: 1;
      }

      .corner {
        position: absolute;
        opacity: 0.1;
        transform: scale(0) rotate(180deg);
        transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: none;
      }

      .corner.is-visible { transform: scale(1) rotate(0deg); }

      .corner--tl {
        top: 0;
        left: 0;
        width: 128px;
        height: 128px;
        background: radial-gradient(circle, var(--red) 0%, transparent 70%);
      }

      .corner--br {
        bottom: 0;
        right: 0;
        width: 160px;
        height: 160px;
        background: radial-gradient(circle, var(--yellow) 0%, transparent 70%);
        transition-delay: 0.1s;
      }

      .content {
        position: relative;
        z-index: 1;
        padding: 32px;
        text-align: center;
      }

      @media (min-width: 768px) {
        .content { padding: 48px; }
      }

      .title {
        margin: 0 0 8px 0;
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: clamp(56px, 8vw, 96px);
        line-height: 1;
        background: linear-gradient(135deg, var(--red), var(--yellow));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0;
        transform: scale(0.5) translateY(-30px);
      }

      .subtitle {
        font-family: "Dancing Script", cursive;
        font-size: clamp(22px, 3vw, 32px);
        color: #4b5563;
        opacity: 0;
        transform: translateX(-30px);
        transition: all 0.6s ease-out 0.3s;
      }

      .message {
        margin: 0;
        font-family: "Merriweather", serif;
        font-size: clamp(18px, 2.2vw, 20px);
        line-height: 1.7;
        color: #374151;
        opacity: 0;
        transition: all 0.6s ease-out;
      }

      .message + .message { margin-top: 12px; }

      .msg-1 { transform: translateX(-50px); transition-delay: 0.4s; }
      .msg-2 { transform: translateX(50px); transition-delay: 0.6s; }
      .msg-3 { transform: translateX(-50px); transition-delay: 0.8s; }

      .line-wrap {
        display: flex;
        justify-content: center;
        margin: 32px 0;
      }

      .line {
        height: 4px;
        width: 0;
        opacity: 0;
        border-radius: 9999px;
        background: linear-gradient(to right, transparent, var(--red), transparent);
        transition: all 1s ease-out 1s;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 0;
        cursor: pointer;
        padding: 14px 28px;
        border-radius: 9999px;
        color: #fff;
        font-family: "Nunito", sans-serif;
        font-weight: 600;
        font-size: 18px;
        background: linear-gradient(135deg, var(--red), var(--orange));
        box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
        opacity: 0;
        transform: scale(0.5) translateY(20px);
        transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.6s ease-out 1.2s;
      }

      .cta:focus-visible {
        outline: 3px solid rgba(255, 107, 107, 0.35);
        outline-offset: 4px;
      }

      .cta:hover {
        transform: scale(1.05);
        box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
      }

      .hint {
        margin: 16px 0 0 0;
        font-family: "Dancing Script", cursive;
        font-size: 16px;
        color: #6b7280;
        opacity: 0;
        transition: opacity 0.8s ease-out 1.4s;
      }

      .show .title {
        opacity: 1;
        transform: scale(1) translateY(0);
        animation: glow 2s ease-in-out infinite, bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }

      .show .subtitle { opacity: 1; transform: translateX(0); }
      .show .message { opacity: 1; transform: translateX(0); }
      .show .line { width: 128px; opacity: 1; }
      .show .cta { opacity: 1; transform: scale(1) translateY(0); }
      .show .hint { opacity: 1; }
      .show .corner { }

      .heart-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .heart {
        position: absolute;
        bottom: -10%;
        opacity: 0.6;
        animation: float 3s ease-out forwards;
        will-change: transform, opacity;
      }

      .heart svg {
        display: block;
        width: 24px;
        height: 24px;
        fill: var(--red);
      }

      @keyframes float {
        0% { transform: translateY(0) rotate(0deg); opacity: 0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.6; }
        100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
      }

      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 107, 107, 0.3)); }
        50% { filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.6)); }
      }

      @keyframes bounceIn {
        0% { transform: scale(0.3) translateY(-30px); opacity: 0; }
        50% { transform: scale(1.05) translateY(0); }
        70% { transform: scale(0.9) translateY(0); }
        100% { transform: scale(1) translateY(0); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="circle circle--tl" id="circleTL" aria-hidden="true"></div>
    <div class="circle circle--br" id="circleBR" aria-hidden="true"></div>

    <div class="heart-layer" id="heartLayer" aria-hidden="true"></div>

    <main class="card" id="card">
      <div class="corner corner--tl" id="cornerTL" aria-hidden="true"></div>
      <div class="corner corner--br" id="cornerBR" aria-hidden="true"></div>

      <div class="content" id="content">
        <header>
          <h1 class="title">Sorry</h1>
          <div class="subtitle">Bhaiya...</div>
        </header>

        <section style="margin-top: 28px;">
          <p class="message msg-1">I'm really sorry, Bhaiya.</p>
          <p class="message msg-2">I just got angry on you... I shouldn't have.</p>
          <p class="message msg-3">I really want to say sorry. Please forgive me.</p>
        </section>

        <div class="line-wrap" aria-hidden="true">
          <div class="line"></div>
        </div>

        <section>
          <button class="cta" id="cta" type="button" aria-label="Forgive me, Bhaiya">
            <span aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
                <path d="M12 21s-7-4.35-9.6-8.1C.6 10.2 1.2 6.9 4 5.4c2.2-1.2 4.5-.5 6 1 1.5-1.5 3.8-2.2 6-1 2.8 1.5 3.4 4.8 1.6 7.5C19 16.65 12 21 12 21z"></path>
              </svg>
            </span>
            Forgive Me, Bhaiya
          </button>
          <p class="hint"></p>
        </section>
      </div>
    </main>

    <script>
      const heartLayer = document.getElementById("heartLayer");
      const cta = document.getElementById("cta");

      function addHeart() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.style.left = (Math.random() * 100).toFixed(2) + "%";
        heart.style.animationDelay = (Math.random() * 0.5).toFixed(2) + "s";

        heart.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.35-9.6-8.1C.6 10.2 1.2 6.9 4 5.4c2.2-1.2 4.5-.5 6 1 1.5-1.5 3.8-2.2 6-1 2.8 1.5 3.4 4.8 1.6 7.5C19 16.65 12 21 12 21z"/></svg>';

        heartLayer.appendChild(heart);

        window.setTimeout(() => {
          heart.remove();
        }, 3200);
      }

      cta.addEventListener("click", () => {
        addHeart();
      });

      // Staggered entrance animations
      window.setTimeout(() => {
        document.body.classList.add("is-visible");
        document.getElementById("circleTL").classList.add("is-visible");
        document.getElementById("circleBR").classList.add("is-visible");
      }, 100);

      window.setTimeout(() => {
        document.getElementById("card").classList.add("is-visible");
      }, 400);

      window.setTimeout(() => {
        document.getElementById("content").classList.add("show");
        document.getElementById("cornerTL").classList.add("is-visible");
        document.getElementById("cornerBR").classList.add("is-visible");
      }, 900);
    </script>
  </body>
</html>
